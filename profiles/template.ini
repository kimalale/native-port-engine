# Universal Native Port Engine — Game Profile Template
# Copy this file and point game_root to any extracted Android game folder or .apk.
[game]
title              = My Android Game (Native Windows Port)
package            = com.example.game
game_root          = ..\..\my-game-folder
# Optional explicit overrides (auto-discovered if omitted):
# so_path          = ..\..\my-game-folder\lib\x86\libgame.so
# apk_path         = ..\..\my-game-folder\game.apk
# assets_dir       = ..\..\my-game-folder\assets
# save_dir         = ..\..\my-game-folder\save_data
# mod_dir          = ..\..\my-game-folder\mods\textures
backend            = auto   # auto | ndk | polarbit | jni
allow_missing_syms = 1

[graphics]
width              = 1920
height             = 1080
fullscreen         = 0
msaa               = 4
anisotropy         = 16
auto_mipmaps       = -1     # -1 = auto, 1 = force on, 0 = force off
dump_meshes        = 0

[controls]
force_touch_sticks = 0
move_stick_x       = 0.14
move_stick_y       = 0.78
move_stick_r       = 0.10
aim_stick_x        = 0.86
aim_stick_y        = 0.78
aim_stick_r        = 0.10
