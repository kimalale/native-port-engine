# Universal Native Port Engine — Game Profile: Minigore 2: Zombies
[game]
title        = Minigore 2: Zombies (Native Windows Port)
package      = net.mountainsheep.minigore2zombies
game_root    = ..\..\mini-gore
so_path      = ..\..\mini-gore\lib\x86\libminigore2.so
assets_dir   = ..\..\mini-gore\assets
save_dir     = ..\..\mini-gore\save_data
mod_dir      = ..\..\mini-gore\mods\textures
backend      = ndk

[graphics]
width        = 1280
height       = 720
fullscreen   = 0
msaa         = 4
anisotropy   = 16
auto_mipmaps = 1
dump_meshes  = 0

[controls]
force_touch_sticks = 0
move_stick_x = 0.14
move_stick_y = 0.78
move_stick_r = 0.10
aim_stick_x  = 0.86
aim_stick_y  = 0.78
aim_stick_r  = 0.10
